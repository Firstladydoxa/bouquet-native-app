name: Publish to TNI App Store

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allow manual trigger for testing

env:
  # App metadata - Update these for your app
  APP_CATEGORY: "Education"
  APP_SHORT_DESC: "Learn Biblical Hebrew, Koine Greek, and Aramaic through immersive, context-driven lessons from the Scriptures"
  APP_FULL_DESC: |
    Rhapsody Languages is your gateway to understanding the original languages of the Bible. 
    
    **Features:**
    - 📖 Daily curated readings from Hebrew, Greek, and Aramaic texts
    - 🎯 Context-driven learning with real scriptural passages
    - 🔊 Audio pronunciations and transliterations
    - 📚 Comprehensive vocabulary builder with flashcards
    - 🎨 Beautiful, user-friendly interface with dark mode support
    - 🔄 Progress tracking across all languages
    - 💎 Free trial access with premium subscription options
    - 🌍 Offline access to downloaded content
    
    Perfect for seminary students, biblical scholars, pastors, and anyone passionate about understanding Scripture in its original languages.

jobs:
  build-and-publish:
    name: Build APK and Publish to TNI App Store
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # Required to create releases

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 for Android builds
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Extract version from git tag and update app.json
      - name: Update app.json with tag version
        run: |
          # Extract version from tag (e.g., v1.0.3 -> 1.0.3)
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG_NAME#v}"
          
          # Extract major.minor.patch and calculate versionCode
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          
          echo "📋 Tag: $TAG_NAME"
          echo "📱 Version Name: $VERSION_NAME"
          echo "🔢 Version Code: $VERSION_CODE"
          
          # Update app.json using Node.js for reliable JSON manipulation
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            appJson.expo.version = '$VERSION_NAME';
            appJson.expo.android.versionCode = $VERSION_CODE;
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
            console.log('✅ app.json updated with version $VERSION_NAME (code $VERSION_CODE)');
          "
          
          # Verify the changes
          grep -A 5 '"version":' app.json
          grep -A 2 '"versionCode":' app.json

      # 6. Decode and setup keystore BEFORE prebuild
      - name: Setup Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/bouquet-release.keystore
          echo "✅ Keystore file created successfully"
          ls -lh android/app/bouquet-release.keystore

      # 7. Run prebuild with local credentials (will now use updated app.json)
      - name: Run Expo prebuild
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_CAPABILITY_SYNC: 1
          EAS_NO_CREDENTIALS: 1

      # 8. Verify keystore still exists after prebuild
      - name: Verify keystore
        run: |
          if [ -f "android/app/bouquet-release.keystore" ]; then
            echo "✅ Keystore verified"
            ls -lh android/app/bouquet-release.keystore
          else
            echo "❌ Keystore missing after prebuild! Recreating..."
            echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > android/app/bouquet-release.keystore
          fi

      # 9. Extract version information from build.gradle (for verification)
      - name: Extract version info
        id: version_info
        run: |
          VERSION_NAME=$(grep "versionName" android/app/build.gradle | sed 's/.*versionName "\(.*\)"/\1/')
          VERSION_CODE=$(grep "versionCode" android/app/build.gradle | sed 's/.*versionCode \(.*\)/\1/')
          PACKAGE_NAME=$(grep "applicationId" android/app/build.gradle | sed "s/.*applicationId '\(.*\)'/\1/")
          APP_NAME=$(grep "app_name" android/app/src/main/res/values/strings.xml | sed 's/.*>\(.*\)<.*/\1/' || echo "Rhapsody Languages")
          
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          
          echo "📱 App: $APP_NAME"
          echo "📦 Package: $PACKAGE_NAME"
          echo "🏷️ Version: $VERSION_NAME ($VERSION_CODE)"

      # 10. Ensure Gradle wrapper exists
      - name: Setup Gradle wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x ./gradlew
          echo "✅ Gradle wrapper ready"
          ls -lh gradlew

      # 11. Build release APK with local signing
      - name: Build release APK
        run: |
          cd android
          # Build only ARM architectures (most common) to reduce memory usage
          # Disable lint checks for CI (not needed for production, saves time/memory)
          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.lint.checkReleaseBuilds=false \
            --stacktrace
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dorg.gradle.jvmargs=-Xmx3g"
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: bouquet-release.keystore
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 12. Verify APK was created
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            echo "✅ APK built successfully: $APK_SIZE"
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          else
            echo "❌ APK file not found!"
            exit 1
          fi

      # 13. Rename APK with version
      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.VERSION_NAME }}"
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/rhapsody-languages-v${VERSION_NAME}.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/rhapsody-languages-v${VERSION_NAME}.apk" >> $GITHUB_ENV

      # 14. Upload to TNI App Store
      - name: Publish to TNI App Store
        id: publish
        continue-on-error: true
        run: |
          echo "📤 Uploading to TNI App Store..."
          
          # Upload using the correct endpoint and authentication
          HTTP_CODE=$(curl -X POST "${{ secrets.APPSTORE_API_URL }}/apps/upload" \
            -H "X-API-Key: ${{ secrets.APPSTORE_API_KEY }}" \
            -F "apk=@${{ env.APK_PATH }}" \
            -F "package_name=${{ steps.version_info.outputs.PACKAGE_NAME }}" \
            -F "app_name=${{ steps.version_info.outputs.APP_NAME }}" \
            -F "version_name=${{ steps.version_info.outputs.VERSION_NAME }}" \
            -F "version_code=${{ steps.version_info.outputs.VERSION_CODE }}" \
            -F "category=${{ env.APP_CATEGORY }}" \
            -F "short_description=${{ env.APP_SHORT_DESC }}" \
            -F "full_description=${{ env.APP_FULL_DESC }}" \
            -F "changelog=Release notes for version ${{ steps.version_info.outputs.VERSION_NAME }}" \
            --write-out "%{http_code}" \
            --output response.json)
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Successfully published to TNI App Store"
            cat response.json
            echo "PUBLISH_STATUS=success" >> $GITHUB_OUTPUT
          else
            echo "⚠️ TNI App Store API returned HTTP $HTTP_CODE"
            echo "Response:"
            cat response.json || echo "No response body"
            echo "PUBLISH_STATUS=failed" >> $GITHUB_OUTPUT
            echo ""
            echo "ℹ️ APK was built successfully and will be available in GitHub Release"
            echo "   You can manually upload to TNI App Store later"
          fi

      # 13. Upload APK as GitHub artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rhapsody-languages-v${{ steps.version_info.outputs.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      # 14. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.APK_PATH }}
          body: |
            ## Rhapsody Languages v${{ steps.version_info.outputs.VERSION_NAME }}
            
            **Package:** ${{ steps.version_info.outputs.PACKAGE_NAME }}
            **Version Code:** ${{ steps.version_info.outputs.VERSION_CODE }}
            **Category:** ${{ env.APP_CATEGORY }}
            
            ### Download
            - APK available in TNI App Store
            - Direct download attached to this release
            
            ### What's New
            See RELEASE_NOTES.md for detailed changelog.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 15. Cleanup
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f android/app/bouquet-release.keystore
          rm -f android/keystore.properties
          echo "🧹 Cleaned up sensitive files"

      # 16. Summary
      - name: Job Summary
        if: always()
        run: |
          echo "## 🎉 Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** ${{ steps.version_info.outputs.APP_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version_info.outputs.VERSION_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ steps.version_info.outputs.PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Category:** ${{ env.APP_CATEGORY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.publish.outputs.PUBLISH_STATUS }}" = "success" ]; then
            echo "✅ Published to TNI App Store" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ TNI App Store upload failed (API endpoint issue)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Manual Upload Required:**" >> $GITHUB_STEP_SUMMARY
            echo "1. Download APK from GitHub Release below" >> $GITHUB_STEP_SUMMARY
            echo "2. Upload manually to TNI App Store admin panel" >> $GITHUB_STEP_SUMMARY
            echo "3. Or fix API endpoint and re-run workflow" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "✅ GitHub Release created" >> $GITHUB_STEP_SUMMARY
          echo "✅ APK artifact uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download APK" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version_info.outputs.VERSION_NAME }})" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Artifacts (see below)" >> $GITHUB_STEP_SUMMARY
