name: Build Test APK

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-debug:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build Debug APK
        env:
          ORG_GRADLE_PROJECT_BOUQUET_RELEASE_STORE_FILE: ../bouquet-release.keystore
          ORG_GRADLE_PROJECT_BOUQUET_RELEASE_KEY_ALIAS: bouquet-key-alias
          ORG_GRADLE_PROJECT_BOUQUET_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BOUQUET_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rhapsody-languages-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 5
