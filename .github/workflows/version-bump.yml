name: Auto Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      create_release:
        description: 'Create GitHub release'
        required: false
        type: boolean
        default: true

jobs:
  bump-version:
    name: Bump Version and Tag
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 🔧 Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔢 Bump version
        id: version
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version ${{ github.event.inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old_version=$OLD_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Version bumped from $OLD_VERSION to $NEW_VERSION"

      - name: 📝 Update app.json version
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          node -e "const fs=require('fs'); const app=JSON.parse(fs.readFileSync('app.json')); app.expo.version='$NEW_VERSION'; fs.writeFileSync('app.json', JSON.stringify(app, null, 2));"

      - name: 📋 Generate Changelog
        id: changelog
        run: |
          echo "## What's Changed" > CHANGES.md
          git log v${{ steps.version.outputs.old_version }}..HEAD --pretty=format:"- %s (%an)" >> CHANGES.md
          cat CHANGES.md

      - name: 💾 Commit changes
        run: |
          git add package.json package-lock.json app.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }}"
          git tag -a "v${{ steps.version.outputs.new_version }}" -m "Release v${{ steps.version.outputs.new_version }}"

      - name: 🚀 Push changes
        run: |
          git push origin main
          git push origin "v${{ steps.version.outputs.new_version }}"

      - name: 📊 Summary
        run: |
          echo "### 🎉 Version Bumped!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Old Version:** ${{ steps.version.outputs.old_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**New Version:** ${{ steps.version.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ github.event.inputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Tag v${{ steps.version.outputs.new_version }} has been created and pushed." >> $GITHUB_STEP_SUMMARY
          echo "The release workflow will now automatically build and create a GitHub release." >> $GITHUB_STEP_SUMMARY
