name: Distribute APK

on:
  workflow_dispatch:
    inputs:
      distribution_message:
        description: 'Distribution message for testers'
        required: false
        default: 'New build available for testing'
      build_profile:
        description: 'Build profile to use'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-and-distribute:
    name: Build and Distribute APK
    runs-on: ubuntu-latest
    
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
          cache: 'npm'

      - name: 🏗 Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Build APK
        run: |
          echo "Building ${{ github.event.inputs.build_profile }} profile..."
          eas build --platform android --profile ${{ github.event.inputs.build_profile }} --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download APK
        id: download
        run: |
          BUILD_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].id')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          FILENAME="rhapsody-languages-${{ github.event.inputs.build_profile }}-${TIMESTAMP}.apk"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          
          curl -L -o "$FILENAME" "$BUILD_URL"
          ls -lh "$FILENAME"

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.download.outputs.filename }}
          path: ${{ steps.download.outputs.filename }}
          retention-days: 30

      - name: 📧 Create Distribution Summary
        run: |
          cat << EOF > distribution-info.md
          # 📱 New APK Build Available
          
          ## Build Information
          - **Profile:** ${{ github.event.inputs.build_profile }}
          - **Build ID:** ${{ steps.download.outputs.build_id }}
          - **Commit:** ${{ github.sha }}
          - **Branch:** ${{ github.ref_name }}
          - **Build Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          ## Distribution Message
          ${{ github.event.inputs.distribution_message }}
          
          ## Download APK
          - [Download from GitHub Actions Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          - [Download from EAS](${{ steps.download.outputs.build_url }})
          
          ## Installation Instructions
          1. Download the APK file
          2. On your Android device, go to Settings → Security
          3. Enable "Install from unknown sources" or "Unknown sources"
          4. Open the downloaded APK file
          5. Follow the installation prompts
          
          ## Testing Notes
          Please test the following:
          - [ ] App launches successfully
          - [ ] Authentication works
          - [ ] Subscription features
          - [ ] Language switching
          - [ ] PDF viewing
          - [ ] Audio/Video playback
          - [ ] Download functionality
          
          ## Feedback
          Report issues to: [GitHub Issues](https://github.com/${{ github.repository }}/issues)
          EOF
          
          cat distribution-info.md

      - name: 📤 Upload Distribution Info
        uses: actions/upload-artifact@v4
        with:
          name: distribution-info
          path: distribution-info.md

      - name: 📊 Build Summary
        run: |
          echo "### 📱 APK Build and Distribution Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Profile:** ${{ github.event.inputs.build_profile }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build ID:** ${{ steps.download.outputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Filename:** ${{ steps.download.outputs.filename }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download Options" >> $GITHUB_STEP_SUMMARY
          echo "1. Download from Artifacts section above" >> $GITHUB_STEP_SUMMARY
          echo "2. [Download from EAS Build](${{ steps.download.outputs.build_url }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Distribution Message" >> $GITHUB_STEP_SUMMARY
          echo "${{ github.event.inputs.distribution_message }}" >> $GITHUB_STEP_SUMMARY
